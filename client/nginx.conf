server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index spa-shell.html;

    # Docker service DNS is resolved on requests, not nginx startup, so an
    # unavailable mandatory backend does not prevent the frontend returning 503.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_backend backend:8080;

    error_page 502 504 =503 /_publisher-unavailable;
    location = /_publisher-unavailable {
        internal;
        default_type text/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 503 '<!doctype html><title>Countrydle temporarily unavailable</title><h1>Publisher content temporarily unavailable</h1><p>Please try again shortly.</p>';
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8765/healthz;
        proxy_read_timeout 5s;
    }

    location = /sitemap.xml {
        proxy_pass http://$api_backend/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        proxy_pass http://127.0.0.1:8765;
    }
    location = /index.html {
        return 308 /;
    }

    # The publisher process serves the atomic current release only while all
    # required public data is available. Deleted/unknown posts return real 404s.
    location ~ ^/(?:about|how-it-works|faq|privacy-policy|terms|cookie-policy|contact|explore(?:/modes/(?:countrydle|us-states|us_statedle|wojewodztwa|powiaty|flagdle|europe|asia|africa|americas))?)/?$ {
        proxy_pass http://127.0.0.1:8765;
    }
    location ~ ^/blog(?:/.*)?$ {
        proxy_pass http://127.0.0.1:8765;
    }

    location = /spa-shell.html {
        internal;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. {
        deny all;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        # Never use the rendered homepage to boot another SPA route.
        try_files $uri /spa-shell.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
