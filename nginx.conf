worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name countrydle.online www.countrydle.online;

        # Redirect to HTTPS
        return 301 https://$host$request_uri;
    }

    # SSL Configuration for HTTPS Traffic
    server {
        listen 443 ssl;
        server_name countrydle.online www.countrydle.online;

        # SSL certificate and key
        ssl_certificate /etc/ssl/certs/countrydle.online.crt;
        ssl_certificate_key /etc/ssl/certs/countrydle.online.key;
        ssl_trusted_certificate /etc/ssl/certs/countrydle.online.ca-bundle;

        # SSL protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Allow the configured Google CMP/ads without permitting arbitrary third-party origins.
        # These permissions do not activate ads; the client remains consent/inventory gated.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://*.google.com https://*.gstatic.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://unpkg.com https://flagcdn.com https://server.arcgisonline.com https://*.google.com https://*.gstatic.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.googleusercontent.com; font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080 ws://localhost:8080 ws://127.0.0.1:8080 ws://localhost:5173 ws://127.0.0.1:5173 wss://countrydle.online wss://www.countrydle.online https://*.google.com https://*.gstatic.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com; frame-src 'self' https://*.google.com https://*.gstatic.com https://*.googlesyndication.com https://*.doubleclick.net https://*.googleadservices.com https://*.googleusercontent.com;" always;

        # Proxy API requests to backend service on port 8080
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 90s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keep the public sitemap backed by the live blog database.
        location = /sitemap.xml {
            proxy_pass http://backend:8080/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve the React frontend application
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
