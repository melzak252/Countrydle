version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: database
    networks:
      - countrydle
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    networks:
      - countrydle
    ports:
      - 6351:6333
      - 6352:6334 
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - qdrant_snapshots:/qdrant/snapshots
      - ./qdrant_data:/qdrant/storage
    depends_on:
      - db

  backend:
    container_name: server
    build: ./server
    command: uvicorn app:app --host 0.0.0.0 --port 8080
    networks:
      - countrydle
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - QUIZ_MODEL=${QUIZ_MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REMEMBER_ME_EXPIRE_DAYS=${REMEMBER_ME_EXPIRE_DAYS:-90}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_SIZE=${EMBEDDING_SIZE}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - NOREPLY_EMAIL=${NOREPLY_EMAIL}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_PROJECT_NUMBER=${GEMINI_PROJECT_NUMBER}
      - LOCAL_QUESTION_MODEL=${LOCAL_QUESTION_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_QUESTION_MODEL=${GEMINI_QUESTION_MODEL:-gemini-2.5-flash-lite}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./server:/usr/src/app
      - ./data:/usr/src/app/data

  frontend:
    container_name: client
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_RYBBIT_SCRIPT_URL: ${VITE_RYBBIT_SCRIPT_URL}
        VITE_RYBBIT_SITE_ID: ${VITE_RYBBIT_SITE_ID}
        VITE_GOOGLE_ADSENSE_ID: ${VITE_GOOGLE_ADSENSE_ID}
        VITE_ADSENSE_ENABLED: ${VITE_ADSENSE_ENABLED:-false}
        # JSON mapping of placement keys to real account slot IDs; empty is failclosed.
        VITE_ADSENSE_SLOTS: ${VITE_ADSENSE_SLOTS:-}
    environment:
      PUBLISHER_BACKEND_URL: ${PUBLISHER_BACKEND_URL:-http://backend:8080}
      PUBLISHER_ORIGIN: ${PUBLISHER_ORIGIN:-https://countrydle.online}
      PUBLISHER_POLL_SECONDS: ${PUBLISHER_POLL_SECONDS:-60}
      PUBLISHER_CAPTURE_TIMEOUT: ${PUBLISHER_CAPTURE_TIMEOUT:-45}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    networks:
      - countrydle
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  qdrant_snapshots:

networks:
  countrydle:
    driver: bridge

