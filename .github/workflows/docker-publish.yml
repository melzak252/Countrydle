name: Regression Gates and Docker Publication

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# PRs (including forks) have no registry credentials or package-write scope.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      PYTHON_DOTENV_DISABLED: "1"
      SECRET_KEY: isolated-ci-signing-key-not-for-deployment-0123456789
      ALGORITHM: HS256
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5181
      EMAIL_USERNAME: ci@example.com
      EMAIL_PASSWORD: not-a-mail-password
      NOREPLY_EMAIL: ci@example.com
      GOOGLE_CLIENT_ID: offline-ci-suite
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      GOOGLE_API_KEY: ""
      QDRANT_HOST: 127.0.0.1
      QDRANT_PORT: "1"
      COUNTRYDLE_RUN_LIVE_FALLBACK_EVAL: "0"
      COUNTRYDLE_RUN_LIVE_PLANNER_EVAL: "0"
      DATABASE_URL: postgresql+asyncpg://countrydle_ci:ci-only-disposable-password@127.0.0.1:5432/countrydle_test
      QUESTION_TEST_DATABASE_URL: postgresql+asyncpg://countrydle_ci:ci-only-disposable-password@127.0.0.1:5432/countrydle_test
      FRIEND_TEST_DATABASE_URL: postgresql+asyncpg://countrydle_ci:ci-only-disposable-password@127.0.0.1:5432/countrydle_test
      PARTICIPATION_TEST_DATABASE_URL: postgresql+asyncpg://countrydle_ci:ci-only-disposable-password@127.0.0.1:5432/countrydle_test
      PROFILE_STATS_TEST_DATABASE_URL: postgresql+asyncpg://countrydle_ci:ci-only-disposable-password@127.0.0.1:5432/countrydle_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-bootstrap-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked backend dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Create the disposable regression database
        env:
          PGPASSWORD: ci-only-bootstrap-password
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE countrydle_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-only-disposable-password';
          CREATE DATABASE countrydle_test OWNER countrydle_ci;
          SQL
          psql -h 127.0.0.1 -U postgres -d countrydle_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector;'
      - name: Run all offline backend regressions and isolated PostgreSQL tests
        run: python -m pytest -q tests

  frontend-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      PYTHON_DOTENV_DISABLED: "1"
      VITE_API_URL: /api
      PRERENDER_STATIC_ONLY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up supported Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Set up supported Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Set up Python 3.12 for prerender regressions
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install authoritative npm lock
        run: npm ci
      - name: Run all regular Bun and Python prerender regressions
        run: bun run test
      - name: Install the locked Chromium runtime for static snapshots
        run: |
          bunx --bun playwright install --with-deps chromium
          echo "CHROME_BIN=$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath());')" >> "$GITHUB_ENV"
      - name: Typecheck, bundle, and explicitly prerender without a backend
        run: bun run build

  browser-journeys:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      PYTHON_DOTENV_DISABLED: "1"
      E2E_DATABASE_URL: postgresql+asyncpg://e2e:browser-only-disposable-password@127.0.0.1:5432/countrydle_e2e
      E2E_WEB_PORT: "5181"
      E2E_API_PORT: "8087"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-bootstrap-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked backend dependencies
        working-directory: server
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Set up supported Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Set up supported Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install authoritative npm lock and Chromium
        run: |
          npm ci
          bunx --bun playwright install --with-deps chromium
      - name: Create the exclusively disposable managed-browser database
        env:
          PGPASSWORD: ci-only-bootstrap-password
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE e2e LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'browser-only-disposable-password';
          CREATE DATABASE countrydle_e2e OWNER e2e;
          SQL
          psql -h 127.0.0.1 -U postgres -d countrydle_e2e -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector;'
      - name: Run actual managed desktop and mobile gameplay and accessibility journeys
        # No project filter: both configured projects are mandatory. The launcher
        # owns a fresh private schema and a key-free, provider-isolated sandbox.
        run: E2E_PYTHON="$(command -v python)" bun run test:e2e

  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./server
            build-args: ""
          - image: frontend
            context: ./client
            build-args: |
              VITE_API_URL=/api
              PRERENDER_STATIC_ONLY=1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the image locally without login or publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: countrydle-${{ matrix.image }}:regression-check
          build-args: ${{ matrix.build-args }}

  publish-backend:
    needs: [backend-regressions, frontend-regressions, browser-journeys, build-images]
    # Default success() semantics keep any failed/cancelled/skipped gate from
    # publishing. Never use always() or pull_request_target for these jobs.
    if: >-
      github.event_name == 'push' && github.event.repository.fork == false &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract approved release metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-frontend:
    needs: [backend-regressions, frontend-regressions, browser-journeys, build-images]
    if: >-
      github.event_name == 'push' && github.event.repository.fork == false &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract approved release metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
            PRERENDER_STATIC_ONLY=1
            VITE_RYBBIT_SCRIPT_URL=${{ vars.VITE_RYBBIT_SCRIPT_URL }}
            VITE_RYBBIT_SITE_ID=${{ vars.VITE_RYBBIT_SITE_ID }}
            VITE_GOOGLE_ADSENSE_ID=${{ vars.VITE_GOOGLE_ADSENSE_ID }}
